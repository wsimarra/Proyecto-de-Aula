<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión y Seguimiento de Proyectos de Aula · V5</title>
<style>
:root{--navy:#153f70;--blue:#0b5ea8;--red:#b51f32;--ink:#16243a;--muted:#66758a;--bg:#edf3f8;--card:#fff;--line:#dbe4ee;--ok:#16845b;--warn:#b66a00;--shadow:0 10px 28px rgba(20,55,90,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:linear-gradient(180deg,#173f70,#143861);color:white;position:fixed;left:0;top:0;bottom:0;padding:24px 18px;z-index:5}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:30px}.logo{width:52px;height:52px;border-radius:50%;background:white;padding:4px;object-fit:contain}.brand small{display:block;letter-spacing:2px;font-size:10px;font-weight:800;opacity:.8}.brand strong{font-size:20px}
.nav-title{font-size:10px;letter-spacing:2px;font-weight:800;opacity:.65;margin:20px 10px 10px}.nav button{width:100%;border:0;background:transparent;color:white;text-align:left;padding:12px 13px;border-radius:10px;margin:2px 0;font-weight:700;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);box-shadow:inset 3px 0 var(--red)}
.source{position:absolute;bottom:22px;left:22px;font-size:11px;opacity:.85}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#31c57a;margin-right:7px}
.main{margin-left:260px;width:calc(100% - 260px);padding:28px 34px 50px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--blue)}h1{font-size:34px;line-height:1.08;margin:8px 0}.subtitle{color:var(--muted)}.actions{display:flex;gap:10px;align-items:center}.period-card,.btn{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 15px}.period-card small{display:block;color:var(--muted);font-size:10px}.period-card strong{font-size:15px}.btn{cursor:pointer;font-weight:800;color:white;background:var(--navy);border-color:var(--navy)}.btn.secondary{background:white;color:var(--navy)}
.filters{margin-top:20px;background:white;border:1px solid var(--line);border-radius:15px;padding:15px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;box-shadow:var(--shadow)}label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.7px}.field select,.field input{width:100%;margin-top:6px;height:39px;border:1px solid #d3dfeb;border-radius:9px;background:#f6f9fc;padding:0 10px;color:var(--ink)}
.content{margin-top:22px}.section-head{margin:5px 0 14px}.section-head .eyebrow{margin-bottom:5px}.section-head h2{margin:0;font-size:25px}.section-head p{margin:6px 0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:17px;min-height:125px}.kpi .label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.8px}.kpi .value{font-size:29px;font-weight:900;margin-top:9px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:6px}.kpi.primary{background:linear-gradient(135deg,#1a4e82,#b72d62);color:white}.kpi.primary .label,.kpi.primary .hint{color:#fff;opacity:.9}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.panel{padding:18px}.panel h3{margin:0 0 13px;font-size:17px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f1fa;color:var(--blue);font-size:10px;font-weight:800}
.bars{height:260px;display:flex;align-items:end;gap:14px;padding:12px 4px}.baritem{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px}.bar{width:60%;max-width:54px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--red),var(--blue));min-height:4px}.barlabel,.barvalue{font-size:10px;font-weight:800}.barlabel{color:var(--muted)}
.list{display:flex;flex-direction:column}.row{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.row:last-child{border-bottom:0}.row strong{font-size:12px}.row span{font-size:12px;color:var(--muted)}
.tablewrap{overflow:auto}.searchrow{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.searchrow input{max-width:340px;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--navy);color:white;text-align:left;padding:10px;position:sticky;top:0}td{padding:10px;border-bottom:1px solid var(--line)}tr:hover td{background:#f7fbff}.status{font-size:11px;color:var(--muted);margin-top:10px}.pill-ok{background:#dff5ea;color:var(--ok);padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.pill-warn{background:#fff0d9;color:var(--warn);padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}
.empty{padding:30px;text-align:center;color:var(--muted)}.audit{line-height:1.6;font-size:13px}.metricline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.metricline:last-child{border:0}.small{font-size:11px;color:var(--muted)}
.highlight-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.rank{width:34px;height:34px;border-radius:50%;background:#e8f1fa;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:900}.highlight-card{padding:18px}.highlight-title{font-size:18px;font-weight:900;line-height:1.25}.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.member{background:#f3f7fb;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--ink)}.score{font-size:24px;font-weight:900;color:var(--navy)}.pdf-btn{display:inline-block;margin-top:12px;text-decoration:none;background:var(--navy);color:white;padding:9px 12px;border-radius:9px;font-size:11px;font-weight:800}.pdf-muted{display:inline-block;margin-top:12px;background:#f6f9fc;color:var(--muted);padding:9px 12px;border-radius:9px;font-size:11px;font-weight:700}.pdf-actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}.pdf-upload-btn{display:inline-flex;align-items:center;cursor:pointer;background:#fff;border:1px solid var(--navy);color:var(--navy);padding:8px 11px;border-radius:9px;font-size:11px;font-weight:800}.pdf-actions .pdf-btn{margin-top:0}.pdf-actions .pdf-muted{margin-top:0}.scoreline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:12px}.scoreline strong{font-size:20px;color:var(--navy)}.criteria{padding:11px 13px;border-left:4px solid var(--red);background:#fff8f9;border-radius:8px;font-size:12px;color:var(--muted);margin:12px 0}.semester-badge{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:1px}
.project-name{font-weight:800;color:var(--ink);max-width:360px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-context{font-size:10px;color:var(--muted);margin-top:3px}.score-badge{display:inline-block;min-width:54px;text-align:center;background:#e4f6ea;color:#11683f;padding:5px 9px;border-radius:8px;font-weight:900}.audit-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.audit-stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fbfe}.audit-stat .num{font-size:25px;font-weight:900;color:var(--navy);margin-top:4px}.audit-stat .lbl{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.6px}.audit-rules{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rule-list{display:grid;gap:9px}.rule{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;background:#f7fbff;border-radius:9px;color:var(--muted);font-size:12px}.rule b{color:var(--ok);font-size:13px}.audit-table{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}.audit-table table{min-width:700px}.audit-note{padding:10px 12px;background:#f6f9fc;border-radius:9px;color:var(--muted);font-size:11px;margin-top:10px}.quality-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.quality-chip.ok{background:#e2f6eb;color:var(--ok)}.quality-chip.warn{background:#fff1dc;color:var(--warn)}
@media(max-width:900px){.highlight-grid{grid-template-columns:1fr}}
@media(max-width:1200px){.filters{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}}
@media(max-width:760px){.sidebar{position:static;width:100%;min-height:auto}.app{display:block}.main{margin:0;width:100%;padding:20px}.source{position:static;margin-top:20px}.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.top{display:block}.actions{margin-top:15px}.grid3{grid-template-columns:1fr}}
@media(max-width:480px){.filters,.kpis{grid-template-columns:1fr}}
.leader-filters{margin:0 0 16px;background:#f8fbfe;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.leader-layout{display:grid;grid-template-columns:1.45fr .75fr;gap:16px}.leader-detail{position:sticky;top:18px;height:max-content}.leader-name{font-size:18px;font-weight:900;color:var(--navy);margin:6px 0 14px}.leader-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.leader-kpi{background:#f6f9fc;border:1px solid var(--line);border-radius:10px;padding:10px}.leader-kpi strong{display:block;font-size:20px;color:var(--navy)}.leader-kpi span{font-size:10px;color:var(--muted)}.leader-info{padding:11px 12px;background:#f7fbff;border-radius:10px;font-size:12px;color:var(--muted);line-height:1.5}.leader-chip{display:inline-block;background:#e8f1fa;color:var(--blue);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.leader-table td,.leader-table th{white-space:nowrap}.leader-table td:nth-child(3){font-weight:800;color:var(--ink)}
@media(max-width:900px){.leader-layout{grid-template-columns:1fr}.leader-detail{position:static}.leader-filters{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.leader-filters,.leader-kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><img class="logo" src="/static/logo.png"><div><small>FACULTAD</small><strong>Proyectos Aula</strong></div></div>
  <div class="nav-title">PANEL</div>
  <div class="nav">
    <button data-page="resumen">◉ &nbsp; RESUMEN EJECUTIVO</button>
    <button data-page="proyectos">▦ &nbsp; PROYECTOS</button>
    <button data-page="destacados">★ &nbsp; PROYECTOS DESTACADOS</button>
    <button data-page="lideres">♟ &nbsp; LÍDERES DE COLECTIVO</button>
    <button data-page="programas">▤ &nbsp; PROGRAMAS</button>
    <button data-page="estudiantes">♟ &nbsp; ESTUDIANTES</button>
    <button data-page="docentes">♟ &nbsp; DOCENTES</button>
    <button data-page="evaluacion">✓ &nbsp; EVALUACIÓN</button>
    <button data-page="historial">↗ &nbsp; HISTORIAL</button>
    <button data-page="auditoria">☷ &nbsp; AUDITORÍA</button>
  </div>
  <div class="source"><span class="dot"></span>Fuente local · <span id="fileCount">—</span> archivos</div>
</aside>
<main class="main">
  <header class="top">
    <div><div class="eyebrow">FUNDACIÓN UNIVERSITARIA TECNOLÓGICO COMFENALCO</div><h1>Gestión y Seguimiento<br>de Proyectos de Aula</h1><div class="subtitle">Modelo dinámico · datos académicos y proyectos de aula</div></div>
    <div class="actions"><div class="period-card"><small>Periodo académico</small><strong id="periodLabel">—</strong></div><button class="btn" id="refresh">↻ Actualizar<br>datos</button></div>
  </header>
  <section class="filters" id="filters">
    <div class="field"><label>PERIODO</label><select id="period"></select></div>
    <div class="field"><label>PROGRAMA</label><select id="program"></select></div>
    <div class="field"><label>SEMESTRE</label><select id="semester"></select></div>
    <div class="field"><label>SECCIÓN</label><select id="section"></select></div>
    <div class="field"><label>GRUPO</label><select id="group"></select></div>
    <div class="field"><label>DOCENTE</label><select id="teacher"></select></div>
    <div class="field"><label>ASIGNATURA</label><select id="subject"></select></div>
  </section>
  <div id="content" class="content"></div>
</main>
</div>
<script>
const state={page:'resumen',filters:{period:'',program:'',semester:'',section:'',group:'',teacher:'',subject:''},leaderFilters:{period:'',program:'',semester:'',section:'',leader:'',subject:''},data:null};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function q(){const p=new URLSearchParams();for(const[k,v]of Object.entries(state.filters))if(v)p.set(k,v);return p.toString()}
function opts(arr,current){return `<option value="">Todos</option>`+arr.map(x=>`<option value="${esc(x)}" ${String(x)===String(current)?'selected':''}>${esc(x)}</option>`).join('')}
async function loadOptions(){
  const r=await fetch('/api/options?'+q()); const o=await r.json();
  for(const k of Object.keys(state.filters)){const el=$(k);const cur=state.filters[k];const vals=o[k]||[];el.innerHTML=opts(vals,vals.map(String).includes(String(cur))?cur:''); if(cur && !vals.map(String).includes(String(cur)))state.filters[k]='';}
  $('periodLabel').textContent=state.filters.period||'Todos';
}
async function load(){
  state.data=await fetch('/api/dashboard?'+q()).then(r=>r.json());
  await loadOptions();
  render();
}
function sectionHead(k,t,d){return `<div class="section-head"><div class="eyebrow">${k}</div><h2>${t}</h2><p>${d}</p></div>`}
function kpi(label,val,hint,primary=false){return `<div class="card kpi ${primary?'primary':''}"><div class="label">${label}</div><div class="value">${val??'—'}</div><div class="hint">${hint}</div></div>`}
function shortTitle(title,max=42){const t=String(title??'').trim();if(!t)return 'Sin título';if(/^(proyecto\s*\d+|grupo\s*#?\s*\d+)$/i.test(t))return t;return t.length>max?t.slice(0,max-1).trimEnd()+'…':t}
function projectRows(projects){return projects.map(p=>`<tr><td><strong>${esc(p.group)}</strong></td><td><span class="project-name" title="${esc(p.title)}">${esc(shortTitle(p.title))}</span></td><td>${p.student_count}</td><td>${p.final_grade==null?'—':p.final_grade.toFixed(2)}</td><td>${p.final_grade==null?'<span class="pill-warn">SIN NOTA</span>':'<span class="pill-ok">CON NOTA</span>'}</td></tr>`).join('')}
function renderResumen(d){
 const top=d.highlights.slice(0,8);
 const max=Math.max(...d.by_semester.map(x=>x.projects),1);
 return sectionHead('RESUMEN EJECUTIVO','Proyectos de Aula','Lectura ejecutiva de la información disponible en la fuente seleccionada.')+
 `<div class="kpis">
 ${kpi('TOTAL PROYECTOS DE AULA',d.kpis.projects,'Proyectos válidos identificados',true)}
 ${kpi('ESTUDIANTES IMPACTADOS',d.kpis.students,'Estudiantes únicos')}
 ${kpi('DOCENTES PARTICIPANTES',d.kpis.teachers,'Docentes relacionados')}
 ${kpi('PROMEDIO NOTA FINAL',d.kpis.avg_final?.toFixed(2),'Promedio de TERCER CORTE disponible')}
 ${kpi('COBERTURA',d.kpis.coverage+'%',`${d.kpis.graded_projects} con nota · ${d.kpis.missing_projects} sin nota`)}
 ${kpi('COHORTES',d.kpis.cohorts,'Semestre + sección')}
 </div>
 <div class="grid2">
  <div class="card panel"><h3>Proyectos por semestre</h3><div class="bars">${d.by_semester.map(x=>`<div class="baritem"><div class="barvalue">${x.projects}</div><div class="bar" style="height:${Math.max(4,x.projects/max*205)}px"></div><div class="barlabel">${x.semester}</div></div>`).join('')}</div></div>
  <div class="card panel"><h3>Proyecto destacado por semestre</h3><div class="list">${top.length?top.map(x=>`<div class="row"><div><strong>${esc(x.group)} · ${esc(x.semester)} · Sec. ${esc(x.section)}</strong><div class="project-context">${esc(shortTitle(x.title,48))}</div></div><span class="score-badge">${x.final_grade.toFixed(2)}</span></div>`).join(''):'<div class="empty">No hay notas disponibles.</div>'}</div></div>
 </div>
 <div class="card panel" style="margin-top:16px"><h3>Top 5 de proyectos de aula</h3><div class="criteria">Criterio: mayor promedio final del grupo según TERCER CORTE de DEFINITIVAS. El resultado respeta los filtros seleccionados.</div><div class="tablewrap"><table><thead><tr><th>#</th><th>Grupo</th><th>Semestre</th><th>Sección</th><th>Proyecto</th><th>Nota</th></tr></thead><tbody>${[...d.projects].filter(p=>p.final_grade!=null).sort((a,b)=>b.final_grade-a.final_grade).slice(0,5).map((p,i)=>`<tr><td><span class="rank">${i+1}</span></td><td><strong>${esc(p.group)}</strong></td><td>${esc(p.semester)}</td><td>${p.section}</td><td><span class="project-name" title="${esc(p.title)}">${esc(shortTitle(p.title))}</span></td><td><span class="score-badge">${p.final_grade.toFixed(2)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay proyectos con nota para este contexto.</td></tr>'}</tbody></table></div></div>
 <div class="grid2">
  <div class="card panel"><h3>Promedio por asignatura</h3><div class="list">${d.subject_avg.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name)}</span><strong>${x.avg.toFixed(2)}</strong></div>`).join('')}</div></div>
  <div class="card panel"><h3>Regla de lectura</h3><div class="audit"><strong>Nota final del grupo:</strong> promedio de <em>TER-CORTE</em> en la hoja <em>DEFINITIVAS</em> para los estudiantes del grupo.<br><br><strong>Proyecto válido:</strong> se cuenta si el grupo no es 0 y tiene nota final mayor que 0; si la nota es 0, se conserva únicamente cuando <em>LIDER</em> documenta un título sustantivo.<br><br><strong>Proyecto destacado:</strong> grupo con mayor promedio final disponible dentro de cada semestre. En empate se muestran todos.<br><br><span class="small">El título del proyecto se toma de la sección “TITULOS DE LOS PROYECTOS DE AULA” de LIDER.</span></div></div>
 </div>`;
}
function renderProyectos(d){
 return sectionHead('GESTIÓN','Proyectos de Aula','Consulta los grupos, títulos, estudiantes y nota final según los filtros globales.')+
 `<div class="card panel"><div class="searchrow"><input id="projectSearch" placeholder="Buscar grupo o proyecto..."><button class="btn secondary" onclick="exportCsv()">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Semestre</th><th>Sección</th><th>Grupo</th><th>Proyecto</th><th>Estudiantes</th><th>Nota final</th><th>Estado</th></tr></thead><tbody id="projectBody">${d.projects.map(p=>{const c=(d.projects.find(z=>z===p));return `<tr data-text="${esc((p.group+' '+p.title).toLowerCase())}"><td>${esc((p.semester)||'')}</td><td>${p.section??''}</td><td><strong>${esc(p.group)}</strong></td><td><span class="project-name" title="${esc(p.title)}">${esc(shortTitle(p.title))}</span></td><td>${p.student_count}</td><td>${p.final_grade==null?'—':p.final_grade.toFixed(2)}</td><td>${p.final_grade==null?'<span class="pill-warn">SIN NOTA</span>':'<span class="pill-ok">CON NOTA</span>'}</td></tr>`}).join('')}</tbody></table></div></div>`;
}
async function renderDestacados(d){
 const h=await fetch('/api/highlights?'+q()).then(r=>r.json());
 const top=h.top5||[];
 const by=h.by_semester||[];
 const members=(x)=>x.members?.length?`<div class="members">${x.members.map(n=>`<span class="member">${esc(n)}</span>`).join('')}</div>`:'<div class="small">Integrantes no disponibles.</div>';
 const pdf=(x)=>x.pdf_url ? `<div class="pdf-actions"><a class="pdf-btn" href="${esc(x.pdf_url)}" target="_blank" rel="noopener">📄 Ver PDF</a><label class="pdf-upload-btn">📎 Cambiar PDF<input type="file" accept="application/pdf" hidden onchange="uploadPdf('${esc(x.cohort_id)}','${esc(x.group)}',this)"></label></div>` : `<div class="pdf-actions"><label class="pdf-upload-btn">📎 Adjuntar PDF<input type="file" accept="application/pdf" hidden onchange="uploadPdf('${esc(x.cohort_id)}','${esc(x.group)}',this)"></label><span class="pdf-muted">PDF pendiente</span></div>`;
 return sectionHead('RECONOCIMIENTO ACADÉMICO','Proyectos destacados','Resultados destacados según la nota final registrada.')+
 `<div class="criteria"><strong>Criterio:</strong> ${esc(h.criteria)} Los resultados respetan los filtros globales.</div>`+
 `<div class="card panel"><h3>🏆 Top 5 — Proyectos de Aula</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Grupo</th><th>Semestre</th><th>Sección</th><th>Proyecto</th><th>Nota</th><th>Documento</th></tr></thead><tbody>${top.map((x,i)=>`<tr><td><span class="rank">${i+1}</span></td><td><strong>${esc(x.group)}</strong></td><td>${esc(x.semester)}</td><td>${x.section}</td><td><span class="project-name" title="${esc(x.title)}">${esc(shortTitle(x.title))}</span></td><td><span class="score-badge">${x.final_grade.toFixed(2)}</span></td><td>${pdf(x)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No hay proyectos con nota en el contexto seleccionado.</td></tr>'}</tbody></table></div></div>`+
 `<div class="section-head" style="margin-top:24px"><div class="eyebrow">POR SEMESTRE</div><h2>Proyecto destacado de cada semestre</h2><p>Grupo, semestre, sección, proyecto y nota.</p></div>`+
 `<div class="highlight-grid">${by.map(x=>`<div class="card highlight-card"><div class="semester-badge">${esc(x.semester)} · SECCIÓN ${x.section}</div><div class="score" style="float:right">${x.final_grade.toFixed(2)}</div><div class="highlight-title">Grupo ${esc(x.group)}</div><div class="project-context" style="margin-top:8px">Proyecto: <strong title="${esc(x.title)}">${esc(shortTitle(x.title,52))}</strong></div><div class="small" style="margin-top:6px">Semestre ${esc(x.semester)} · Sección ${esc(x.section)}</div><div style="margin-top:14px;font-weight:800;font-size:11px">Integrantes (${x.members.length})</div>${members(x)}<div class="scoreline"><span>Nota final</span><strong>${x.final_grade.toFixed(2)}</strong></div>${pdf(x)}</div>`).join('')||'<div class="card panel empty">No hay proyectos destacados disponibles para el contexto seleccionado.</div>'}</div>`;
}

async function renderLideres(){
 const lf=state.leaderFilters||{period:'',program:'',semester:'',section:'',leader:'',subject:''}; if(!lf.period && state.filters.period) lf.period=state.filters.period; state.leaderFilters=lf;
 const qp=new URLSearchParams(); for(const [k,v] of Object.entries(lf)) if(v) qp.set(k,v);
 const data=await fetch('/api/collective-leaders?'+qp.toString()).then(r=>r.json());
 const o=data.options||{};
 const select=(id,label,vals)=>`<div class="field"><label>${label}</label><select id="${id}"><option value="">Todos</option>${(vals||[]).map(v=>`<option value="${esc(v)}" ${String(v)===String(lf[id])?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
 const d=data.detail||{};
 const detail=d.name?`<div class="card panel leader-detail"><div class="tag">LÍDER DE COLECTIVO</div><div class="leader-name">${esc(d.name)}</div><div class="leader-info">Docente líder identificado desde la hoja <strong>LIDER</strong>, junto con la asignatura asociada al rol.</div><div class="leader-kpis"><div class="leader-kpi"><strong>${d.sections}</strong><span>Secciones</span></div><div class="leader-kpi"><strong>${d.projects}</strong><span>Proyectos de Aula</span></div><div class="leader-kpi"><strong>${d.students}</strong><span>Estudiantes</span></div></div><h3>Secciones donde es líder</h3><div class="tablewrap"><table><thead><tr><th>Sem.</th><th>Sec.</th><th>Asignatura</th><th>Proyectos</th><th>Estudiantes</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${esc(r.semester)}</td><td>${esc(r.section)}</td><td>${esc(r.leader_subject)}</td><td>${r.project_count}</td><td>${r.student_count}</td></tr>`).join('')}</tbody></table></div></div>`:
 `<div class="card panel leader-detail"><h3>Detalle del líder</h3><div class="empty">Selecciona un líder o una sección para consultar su detalle.</div></div>`;
 return sectionHead('PARTICIPACIÓN ACADÉMICA','Líderes de Colectivo','Consulta el docente líder de cada sección y su relación con los Proyectos de Aula.')+
 `<div class="kpis">${kpi('DOCENTES LÍDERES ÚNICOS',data.unique_leaders,'Personas con rol de líder en el contexto')} ${kpi('SECCIONES ANALIZADAS',data.total,'Asignaciones de liderazgo')} ${kpi('PROYECTOS DE AULA',data.projects_total,'Total válido del modelo')} ${kpi('ESTUDIANTES ÚNICOS',data.students_total,'Fuente actual')}</div>`+
 `<div class="card panel" style="margin-top:16px"><h3>Filtros de líderes</h3><div class="leader-filters">${select('lf-period','Periodo',o.period)}${select('lf-semester','Semestre',o.semester)}${select('lf-section','Sección',o.section)}${select('lf-leader','Líder de Colectivo',o.leader)}${select('lf-subject','Asignatura (Líder)',o.subject)}</div><div class="small">El mismo docente puede aparecer en varias secciones. Cada fila representa una asignación de liderazgo.</div></div>`+
 `<div class="leader-layout" style="margin-top:16px"><div class="card panel"><div class="searchrow"><div><h3 style="margin:0 0 4px">Líderes de Colectivo por Sección</h3><div class="small">${data.total} asignaciones encontradas</div></div><button class="btn secondary" onclick="clearLeaderFilters()">↻ Limpiar</button></div><div class="tablewrap leader-table"><table><thead><tr><th>Semestre</th><th>Sección</th><th>Líder de Colectivo</th><th>Asignatura (Líder)</th><th>Proyectos</th><th>Estudiantes</th></tr></thead><tbody>${data.rows.map(r=>`<tr><td>${esc(r.semester)}</td><td><span class="leader-chip">SEC-${esc(r.section)}</span></td><td>${esc(r.leader_name)}</td><td>${esc(r.leader_subject)}</td><td>${r.project_count}</td><td>${r.student_count}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay líderes para los filtros seleccionados.</td></tr>'}</tbody></table></div></div>${detail}</div>`;
}
function bindLeaderFilters(){
 const ids=['lf-period','lf-semester','lf-section','lf-leader','lf-subject'];
 ids.forEach(id=>$(id)?.addEventListener('change',async()=>{const map={"lf-period":"period","lf-semester":"semester","lf-section":"section","lf-leader":"leader","lf-subject":"subject"};const k=map[id];state.leaderFilters=state.leaderFilters||{period:'',program:'',semester:'',section:'',leader:'',subject:''};state.leaderFilters[k]=$(id).value;for(const other of ids){if(other!==id){const ok=map[other]; if(['period','semester','section','leader','subject'].indexOf(ok)>['period','semester','section','leader','subject'].indexOf(k))state.leaderFilters[ok]='';}}await render();}));
}
function clearLeaderFilters(){state.leaderFilters={period:state.filters.period||'',program:'',semester:'',section:'',leader:'',subject:''};render();}

function renderProgramas(d){
 const map={};d.projects.forEach(p=>{map[p.program??'Programa']??={projects:0,students:0,grades:[]};map[p.program??'Programa'].projects++;map[p.program??'Programa'].students+=p.student_count;if(p.final_grade!=null)map[p.program??'Programa'].grades.push(p.final_grade)});
 return sectionHead('DIMENSIÓN ACADÉMICA','Programas','Programas presentes en el contexto filtrado.')+
 `<div class="grid3">${Object.entries(map).map(([n,x])=>`<div class="card panel"><div class="tag">PROGRAMA</div><h3 style="margin-top:12px">${esc(n)}</h3><div class="metricline"><span>Proyectos de Aula</span><strong>${x.projects}</strong></div><div class="metricline"><span>Estudiantes</span><strong>${x.students}</strong></div><div class="metricline"><span>Promedio</span><strong>${x.grades.length?(x.grades.reduce((a,b)=>a+b,0)/x.grades.length).toFixed(2):'—'}</strong></div></div>`).join('')}</div>`;
}
function renderEstudiantes(){
 return sectionHead('IMPACTO ACADÉMICO','Estudiantes','Estudiantes únicos asociados a las cohortes filtradas.')+
 `<div class="card panel" id="studentPanel"><div class="empty">Cargando estudiantes...</div></div>`;
}
function renderDocentes(){
 return sectionHead('PARTICIPACIÓN','Docentes','Docentes y asignaturas realmente vinculados al contexto seleccionado.')+
 `<div class="card panel" id="teacherPanel"><div class="empty">Cargando docentes...</div></div>`;
}
function renderEvaluacion(d){
 return sectionHead('RENDIMIENTO','Evaluación','Promedios de las asignaturas y notas finales disponibles.')+
 `<div class="grid3">${kpi('PROMEDIO FINAL',d.kpis.avg_final?.toFixed(2),'TER-CORTE')} ${kpi('MÁXIMA',d.projects.filter(p=>p.final_grade!=null).length?Math.max(...d.projects.filter(p=>p.final_grade!=null).map(p=>p.final_grade)).toFixed(2):'—','Mayor promedio de grupo')} ${kpi('COBERTURA',d.kpis.coverage+'%',`${d.kpis.graded_projects}/${d.kpis.projects} grupos`)}</div>`+
 `<div class="grid2"><div class="card panel"><h3>Promedio por asignatura</h3><div class="list">${d.subject_avg.map(x=>`<div class="row"><span>${esc(x.name)}</span><strong>${x.avg.toFixed(2)}</strong></div>`).join('')}</div></div><div class="card panel"><h3>Nota final por grupo</h3><div class="tablewrap"><table><thead><tr><th>Grupo</th><th>Sem.</th><th>Sec.</th><th>Proyecto</th><th>Nota</th></tr></thead><tbody>${d.projects.filter(p=>p.final_grade!=null).sort((a,b)=>b.final_grade-a.final_grade).slice(0,15).map(p=>`<tr><td><strong>${esc(p.group)}</strong></td><td>${esc(p.semester)}</td><td>${p.section}</td><td><span class="project-name" title="${esc(p.title)}">${esc(shortTitle(p.title))}</span></td><td><span class="score-badge">${p.final_grade.toFixed(2)}</span></td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function renderHistorial(d){
 const max=Math.max(...d.by_semester.map(x=>x.avg||0),5);
 return sectionHead('EVOLUCIÓN','Historial','Evolución del periodo disponible. El histórico crecerá automáticamente cuando entren nuevos periodos.')+
 `<div class="card panel"><h3>Promedio final por semestre</h3><div class="bars">${d.by_semester.map(x=>`<div class="baritem"><div class="barvalue">${x.avg??'—'}</div><div class="bar" style="height:${Math.max(4,(x.avg||0)/max*205)}px"></div><div class="barlabel">${x.semester}</div></div>`).join('')}</div></div>`;
}
async function renderAudit(){
 const a=await fetch('/api/audit').then(r=>r.json());
 const ex=a.model.excluded||[];
 const mism=a.files.filter(x=>x.sheet_section!=x.section);
 return sectionHead('AUDITORÍA','Auditoría y control de calidad','Resumen de validación, registros excluidos y reglas aplicadas al modelo.')+
 `<div class="audit-summary"><div class="audit-stat"><div class="lbl">PROYECTOS VÁLIDOS</div><div class="num">${a.model.valid_projects}</div><span class="quality-chip ok">✓ Válidos</span></div><div class="audit-stat"><div class="lbl">REGISTROS EXCLUIDOS</div><div class="num">${a.model.excluded_projects}</div><span class="quality-chip warn">! Revisados</span></div><div class="audit-stat"><div class="lbl">ARCHIVOS PROCESADOS</div><div class="num">${a.files.length}</div><span class="quality-chip ok">✓ Fuente local</span></div><div class="audit-stat"><div class="lbl">INCONSISTENCIAS</div><div class="num">${mism.length}</div><span class="quality-chip ${mism.length?'warn':'ok'}">${mism.length?'! Auditoría':'✓ Sin hallazgos'}</span></div></div>`+
 `<div class="audit-rules"><div class="card panel"><h3>Reglas del modelo</h3><div class="rule-list"><div class="rule"><b>✓</b><span><strong>Proyecto válido:</strong> grupo distinto de 0 y con nota final mayor que 0; los casos con nota 0 solo se conservan si LIDER documenta un título sustantivo.</span></div><div class="rule"><b>✓</b><span><strong>Nota final:</strong> promedio de TERCER CORTE / TER-CORTE de DEFINITIVAS para el grupo.</span></div><div class="rule"><b>✓</b><span><strong>Título:</strong> se toma de LIDER, sección TITULOS DE LOS PROYECTOS DE AULA.</span></div><div class="rule"><b>✓</b><span><strong>Destacado:</strong> mayor nota final del grupo por semestre; se conservan empates.</span></div><div class="rule"><b>✓</b><span><strong>Sección:</strong> se usa la sección del nombre del archivo y se contrasta con LIDER!H2.</span></div></div><div class="audit-note">Periodo: <strong>${esc(a.model.period)}</strong> · Fuente: <strong>${esc(a.model.source)}</strong></div></div>`+
 `<div class="card panel"><h3>Control de calidad</h3><div class="rule-list">${mism.length?mism.map(x=>`<div class="rule"><b>!</b><span><strong>${esc(x.filename)}</strong><br>Nombre: SEC-${x.section} · LIDER: SEC-${x.sheet_section}</span></div>`).join(''):'<div class="rule"><b>✓</b><span>No se detectaron discrepancias de sección.</span></div>'}<div class="rule"><b>✓</b><span><strong>Fuente siguiente:</strong> OneDrive / SharePoint.</span></div></div></div></div>`+
 `<div class="card panel" style="margin-top:16px"><h3>Registros excluidos</h3><p class="small">Estos registros no se cuentan como proyectos válidos. La exclusión queda trazable para revisión.</p><div class="audit-table"><table><thead><tr><th>#</th><th>Archivo</th><th>Sem.</th><th>Sec.</th><th>Grupo</th><th>Motivo</th></tr></thead><tbody>${ex.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.filename)}</td><td>${esc(x.semester)}</td><td>${esc(x.section)}</td><td><strong>${esc(x.group)}</strong></td><td><span class="quality-chip warn">${esc(x.reason)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay registros excluidos.</td></tr>'}</tbody></table></div></div>`;
}

async function uploadPdf(cohortId, group, input){
  const file=input.files?.[0];
  if(!file) return;
  if(file.type!=="application/pdf"){ alert("Selecciona un archivo PDF."); input.value=""; return; }
  if(file.size>20*1024*1024){ alert("El PDF supera el límite de 20 MB."); input.value=""; return; }
  const fd=new FormData(); fd.append("file",file);
  try{
    const r=await fetch(`/api/highlights/${encodeURIComponent(cohortId)}/${encodeURIComponent(group)}/pdf`,{method:"POST",body:fd});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||"No se pudo adjuntar el PDF.");
    alert("PDF adjuntado correctamente.");
    await render();
  }catch(e){ alert(e.message||"No se pudo adjuntar el PDF."); }
  finally{ input.value=""; }
}
async function render(){
 const d=state.data; let html='';
 if(state.page==='resumen')html=renderResumen(d);
 if(state.page==='proyectos')html=renderProyectos(d);
 if(state.page==='destacados')html=await renderDestacados(d);
 if(state.page==='lideres')html=await renderLideres();
 if(state.page==='programas')html=renderProgramas(d);
 if(state.page==='estudiantes')html=renderEstudiantes();
 if(state.page==='docentes')html=renderDocentes();
 if(state.page==='evaluacion')html=renderEvaluacion(d);
 if(state.page==='historial')html=renderHistorial(d);
 if(state.page==='auditoria')html=await renderAudit();
 $('content').innerHTML=html;
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 if(state.page==='estudiantes')loadStudents();
 if(state.page==='docentes')loadTeachers();
 if(state.page==='lideres')bindLeaderFilters();
 if(state.page==='proyectos')$('projectSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#projectBody tr').forEach(r=>r.style.display=r.dataset.text.includes(q)?'':'none')});
}
async function loadStudents(){
 const rows=(await fetch('/api/students?'+q()).then(r=>r.json())).rows;
 $('studentPanel').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Semestre</th><th>Sección</th><th>Grupo</th><th>Proyecto</th><th>Nota grupo</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.student)}</strong></td><td>${r.semester}</td><td>${r.section}</td><td>${r.group}</td><td>${esc(r.project)}</td><td>${r.group_final??'—'}</td></tr>`).join('')}</tbody></table></div><div class="status">${rows.length} registros de estudiantes en el contexto.</div>`:'<div class="empty">No hay estudiantes para los filtros seleccionados.</div>';
}
async function loadTeachers(){
 const rows=(await fetch('/api/teachers?'+q()).then(r=>r.json())).rows;
 $('teacherPanel').innerHTML=rows.length?`<div class="grid3">${rows.map(r=>`<div class="card panel"><div class="tag">DOCENTE</div><h3 style="margin-top:10px">${esc(r.teacher)}</h3><div class="metricline"><span>Asignaturas</span><strong>${r.subjects.length}</strong></div><div class="metricline"><span>Grupos</span><strong>${r.groups}</strong></div><div class="small">${r.subjects.map(esc).join(' · ')}</div></div>`).join('')}</div>`:'<div class="empty">No hay docentes para los filtros seleccionados.</div>';
}
function exportCsv(){window.location='/api/export/projects.csv?'+q()}
for(const b of document.querySelectorAll('.nav button'))b.onclick=async()=>{state.page=b.dataset.page;await render()};
const order=['period','program','semester','section','group','teacher','subject'];
for(const id of order)$(id).onchange=async()=>{
  state.filters[id]=$(id).value;
  const idx=order.indexOf(id);
  for(let i=idx+1;i<order.length;i++){state.filters[order[i]]='';}
  await load();
};
$('refresh').onclick=async()=>{ $('refresh').disabled=true;$('refresh').textContent='Actualizando...';await load();$('refresh').disabled=false;$('refresh').innerHTML='↻ Actualizar<br>datos'};
(async()=>{const m=await fetch('/api/meta').then(r=>r.json());$('fileCount').textContent=m.files;
if(m.periods.length===1)state.filters.period=m.periods[0];
await load()})();
</script>
